services:
  - type: web
    name: voxmind-api
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    rootDir: backend
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: voxmind-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: voxmind-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://voxmind-frontend.onrender.com
      - key: VOXMIND_STORAGE_DIR
        value: /var/data

  - type: web
    runtime: static
    name: voxmind-frontend
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://voxmind-api.onrender.com

databases:
  - name: voxmind-db
    databaseName: voxmind
    user: voxmind
    plan: 0.1c-256mb
    region: frankfurt
