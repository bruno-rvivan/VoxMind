[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxmind-backend"
version = "0.1.0"
description = "Backend for the VoxMind speech analysis application"
requires-python = ">=3.10"
dependencies = [
	"alembic>=1.13,<2",
	"av>=14,<15",
	"email-validator>=2,<3",
	"fastapi>=0.115,<1",
	"faster-whisper>=1.1,<2",
	"PyJWT>=2.9,<3",
	"psycopg[binary]>=3.2,<4",
	"python-dotenv>=1,<2",
	"python-multipart>=0.0.20,<1",
	"pwdlib[argon2]>=0.2.1,<1",
	"sqlalchemy>=2.0,<3",
	"uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
	"httpx>=0.27,<1",
	"pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]
